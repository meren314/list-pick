name: Windows build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        shell: pwsh
        run: ./build.ps1
      - name: Check executable and package
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/清单取件.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke check failed.' }
          ./.venv/Scripts/python.exe package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: list-pick-windows
          path: release/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ./release/*.zip --title "清单取件 $env:GITHUB_REF_NAME" --notes "Windows 离线试验版。下载 ZIP 后完整解压。功能、使用方法及已知限制见 README。程序未签名，跨电脑兼容性仍待验证。" --verify-tag
